stages:
  - validate
  - browser
  - package

default:
  image: node:24-bookworm
  before_script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

validate:
  stage: validate
  script:
    - npm run test:unit
    - npm run typecheck
    - npm run validate:architecture
    - node ./scripts/validate-package.mjs

validate-node-minimum:
  stage: validate
  image: node:22.13-bookworm
  script:
    - npm run validate
    - npm run typecheck

pdfjs-compatibility:
  stage: validate
  parallel:
    matrix:
      - PDFJS_BUILD: [standard, legacy]
  script:
    - node ./scripts/test-pdfjs-compatibility.mjs "$PDFJS_BUILD"

dist-consumers:
  stage: validate
  script:
    - npm run build
    - npm run validate:dist

.browser:
  stage: browser
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/

browser:
  extends: .browser
  parallel:
    matrix:
      - BROWSER_GATE:
          [
            chromium:non-csp,
            firefox:non-csp,
            webkit,
            csp,
            mobile:chromium,
            mobile:firefox,
            mobile:webkit,
          ]
  script:
    - npm run "test:browser:${BROWSER_GATE}"

exact-pack:
  stage: package
  script:
    - rm -rf "$CI_PROJECT_DIR/candidate"
    - PDFJS_VIEWER_CANDIDATE_DIR="$CI_PROJECT_DIR/candidate" npm run test:pack
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - candidate/*.tgz
      - candidate/*.sha256
