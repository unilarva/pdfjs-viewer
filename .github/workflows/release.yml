name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify exact release tag
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run test:compatibility
      - run: npm run build
      - run: npm run validate:dist
      - run: npm run test:browser:chromium:non-csp
      - run: npm run test:browser:firefox:non-csp
      - run: npm run test:browser:csp
      - run: npm run test:browser:mobile:chromium
      - run: npm run test:browser:mobile:firefox
      - run: npm run test:browser:webkit:docker
      - run: npm run test:browser:mobile:webkit:docker
      - run: PDFJS_VIEWER_CANDIDATE_DIR="$RUNNER_TEMP/pdfjs-viewer-candidate" npm run test:pack
      - name: Verify one exact release candidate
        env:
          PDFJS_VIEWER_CANDIDATE_DIR: ${{ runner.temp }}/pdfjs-viewer-candidate
        run: |
          shopt -s nullglob
          candidates=("$PDFJS_VIEWER_CANDIDATE_DIR"/*.tgz)
          checksums=("$PDFJS_VIEWER_CANDIDATE_DIR"/*.tgz.sha256)
          test "${#candidates[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test "${checksums[0]}" = "${candidates[0]}.sha256"
          (cd "$PDFJS_VIEWER_CANDIDATE_DIR" && sha256sum --check "$(basename "${checksums[0]}")")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/pdfjs-viewer-candidate/*.tgz
            ${{ runner.temp }}/pdfjs-viewer-candidate/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@unilarva/pdfjs-viewer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - id: candidate
        name: Verify exact qualified candidate
        env:
          PDFJS_VIEWER_CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
        run: |
          shopt -s nullglob
          candidates=("$PDFJS_VIEWER_CANDIDATE_DIR"/*.tgz)
          checksums=("$PDFJS_VIEWER_CANDIDATE_DIR"/*.tgz.sha256)
          test "${#candidates[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test "${checksums[0]}" = "${candidates[0]}.sha256"
          (cd "$PDFJS_VIEWER_CANDIDATE_DIR" && sha256sum --check "$(basename "${checksums[0]}")")
          echo "tarball=${candidates[0]}" >> "$GITHUB_OUTPUT"
      - run: npm publish "${{ steps.candidate.outputs.tarball }}" --provenance --access public
