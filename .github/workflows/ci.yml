name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck

  pdfjs-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [standard, legacy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ./scripts/test-pdfjs-compatibility.mjs "${{ matrix.build }}"

  dist-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate:dist

  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      env:
        HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chromium
            script: chromium:non-csp
          - label: firefox
            script: firefox:non-csp
          - label: webkit
            script: webkit
          - label: csp
            script: csp
          - label: mobile-chromium
            script: mobile:chromium
          - label: mobile-firefox
            script: mobile:firefox
          - label: mobile-webkit
            script: mobile:webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run "test:browser:${{ matrix.script }}"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.label }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
    env:
      CI: "true"

  exact-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PDFJS_VIEWER_CANDIDATE_DIR="$RUNNER_TEMP/pdfjs-viewer-candidate" npm run test:pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-pack-candidate
          path: |
            ${{ runner.temp }}/pdfjs-viewer-candidate/*.tgz
            ${{ runner.temp }}/pdfjs-viewer-candidate/*.sha256
          if-no-files-found: error
          retention-days: 7
