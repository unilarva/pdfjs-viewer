name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck

  pdfjs-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [standard, legacy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ./scripts/test-pdfjs-compatibility.mjs "${{ matrix.build }}"

  dist-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:dist

  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chromium
            script: chromium:non-csp
          - label: firefox
            script: firefox:non-csp
          - label: webkit
            script: webkit
          - label: csp
            script: csp
          - label: mobile-chromium
            script: mobile:chromium
          - label: mobile-firefox
            script: mobile:firefox
          - label: mobile-webkit
            script: mobile:webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run "test:browser:${{ matrix.script }}"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.label }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
    env:
      CI: "true"

  exact-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: PDFJS_VIEWER_CANDIDATE_DIR="$RUNNER_TEMP/pdfjs-viewer-candidate" npm run test:pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-pack-candidate
          path: |
            ${{ runner.temp }}/pdfjs-viewer-candidate/*.tgz
            ${{ runner.temp }}/pdfjs-viewer-candidate/*.sha256
          if-no-files-found: error
          retention-days: 7
