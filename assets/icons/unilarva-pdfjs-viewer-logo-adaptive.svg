  <title
     id="logo-title">Unilarva PdfjsViewer Logo</title>
  <desc
     id="logo-description">
    A document page held inside a U-shaped viewport.
  </desc>
  <!--
    Self-adapting variant for use as an external image, including README files.
    The artwork remains transparent and responds to the user's color scheme.
  -->
  <style
     id="style1">
    svg {
      color: #aa01cb;
    }

    #logo-u-mark {
      opacity: 0.68;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        color: #e0adee;
      }
    }
  </style>
  <g
     id="logo-u-mark"
     inkscape:groupmode="layer"
     inkscape:label="Unilarva U">
