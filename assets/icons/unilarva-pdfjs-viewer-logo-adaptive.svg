       fill="none"
       stroke="currentColor"
       stroke-width="22"
       stroke-linecap="round"
       stroke-linejoin="round" />
  </g>
  <g
     id="logo-pdf-page-mark"
     inkscape:groupmode="layer"
     inkscape:label="PDF document">
    <path
       id="logo-pdf-page-outline"
       d="M 80,46 H 151 L 176,71 V 181.764502 H 80 Z"
       fill="none"
       stroke="currentColor"
       stroke-width="12"
       stroke-linecap="round"
       stroke-linejoin="round" />
    <path
